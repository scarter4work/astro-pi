[project]
name = "astrometa"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["numpy>=2.0", "astropy>=7.0", "astroquery>=0.4.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
