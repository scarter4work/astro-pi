[project]
name = "gaia-depth-grade"
version = "1.0.0"
description = "Physically-grounded depth grade for astrophotographs using Gaia distances"
requires-python = ">=3.13"
dependencies = ["numpy>=2", "scipy", "astropy>=7", "photutils", "astroquery", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]
# The shipped sidecar is built by tools/build-sidecar.sh from the hash-locked
# tools/sidecar-requirements.txt; this extra is only a convenience for local builds.
build = ["pyinstaller>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
